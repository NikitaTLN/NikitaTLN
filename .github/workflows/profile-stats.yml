name: Refresh profile stats

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check aggregate counts and private repository exclusion
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate aggregate activity and public repository cards
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/update_stats.py
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/stats.svg assets/stats-mobile.svg assets/languages.svg assets/languages-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore(profile): refresh aggregate GitHub stats'
            git push
          fi
